name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ["3.5.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test example
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart test -p chrome
        if: matrix.sdk == 'stable'
      - run: dart run example/main.dart

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: demo
      - run: flutter analyze
        working-directory: demo
      - run: flutter build web --release --base-href /upi_kit/
        working-directory: demo
